[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisroute"
version = "3.0.0"
description = "Cross-platform route measurement, fusion, and routing-security intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AegisRoute contributors"}]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
aegisroute = "aegisroute:main"
aegisroute-agent = "aegisroute_agent:main"

[tool.setuptools]
py-modules = ["aegisroute", "aegisroute_advanced", "aegisroute_scamper", "aegisroute_pro", "aegisroute_agent"]
